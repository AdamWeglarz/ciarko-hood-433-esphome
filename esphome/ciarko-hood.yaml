# Ciarko SU Mini cooker hood - 433 MHz bridge + Bluetooth proxy for Home Assistant
# Board: ESP32-WROOM-32E DevKit, TX: SYN115 on GPIO26, RX (optional): SYN480R on GPIO27
# See README.md for wiring, protocol analysis and troubleshooting.

esphome:
  name: ciarko-hood
  friendly_name: Cooker hood
  min_version: 2026.4.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # arduino leaves too little RAM for the BLE proxy

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

packages:
  codes: !include hood-codes.yaml   # buttons + timing

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# --- Bluetooth proxy (optional; do NOT add web_server, RAM is tight) ---
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# --- 433 MHz hood control ---
globals:
  - id: tgl                # toggle bit, flips on every key press (like the remote)
    type: bool
    restore_value: no
    initial_value: 'false'

remote_transmitter:
  id: rf_tx
  pin: GPIO26
  carrier_duty_percent: 100%   # plain OOK, no sub-carrier
  non_blocking: false

# Receiver (SYN480R) - used to learn the remote. Noise is rejected on the ESP;
# only valid hood frames reach the log, one line per frame:
#   HOOD code=<bits> m1=.. s1=.. m0=.. s0=.. sync=..   (measured us)
# tools/learn_remote.py turns these lines into hood-codes.yaml.
# idle 4ms < sync LOW (~4.6 ms), so every frame ends with its sync HIGH.
# Not needed for sending - remove this block if no receiver is connected.
remote_receiver:
  pin: GPIO27
  tolerance: 50%
  filter: 100us
  idle: 4ms
  buffer_size: 4kb
  on_raw:
    then:
      - lambda: |-
          std::string bits;
          uint32_t m1 = 0, s1 = 0, m0 = 0, s0 = 0, n1 = 0, n0 = 0;
          size_t i = 0;
          for (; i + 1 < x.size(); i += 2) {
            int32_t m = x[i], sp = -x[i + 1];
            if (m > 1100) break;                                  // sync HIGH
            bool lm = m > 380 && m < 1100, sm = m >= 60 && m <= 380;
            bool ls = sp > 380 && sp < 1100, ss = sp >= 60 && sp <= 380;
            if (lm && ss) { bits += '1'; m1 += m; s1 += sp; n1++; }
            else if (sm && ls) { bits += '0'; m0 += m; s0 += sp; n0++; }
            else { bits.clear(); m1 = s1 = m0 = s0 = n1 = n0 = 0; }  // noise - restart
          }
          if (i >= x.size() || x[i] < 1100 || x[i] > 2600) return;
          if (bits.size() < 24 || n1 == 0 || n0 == 0) return;
          ESP_LOGI("hood", "HOOD code=%s m1=%u s1=%u m0=%u s0=%u sync=%d",
                   bits.c_str(), (unsigned) (m1 / n1), (unsigned) (s1 / n1),
                   (unsigned) (m0 / n0), (unsigned) (s0 / n0), (int) x[i]);

# One frame = 36 data bits followed by a sync (HIGH 1530 us, LOW 4590 us).
# The remote repeats frames back to back with no gap, so the whole burst is
# built here and sent in a single transmit call.
# Codes and timing come from hood-codes.yaml (generated by tools/learn_remote.py).
script:
  - id: hood_send
    mode: queued
    parameters:
      code_on: string      # code sent when toggle bit = 1
      code_off: string     # code sent when toggle bit = 0
      times: int           # number of frames in the burst
    then:
      - lambda: |-
          id(tgl) = !id(tgl);
          const std::string &code = id(tgl) ? code_on : code_off;
          auto call = id(rf_tx).transmit();
          auto *d = call.get_data();
          d->set_carrier_frequency(0);
          for (int r = 0; r < times; r++) {
            for (char c : code) {
              if (c == '1') { d->mark(${mark_one}); d->space(${space_one}); }
              else { d->mark(${mark_zero}); d->space(${space_zero}); }
            }
            d->mark(${sync_mark});
            d->space(${sync_space});
          }
          call.perform();

