# Generated by tools/learn_remote.py - codes and timing of one remote.
# Timing = what the ESP receiver measured from the original remote (us).
substitutions:
  mark_one: "750"
  space_one: "240"
  mark_zero: "240"
  space_zero: "750"
  sync_mark: "1620"
  sync_space: "4680"

button:
  - platform: template
    name: "Light"
    icon: mdi:lightbulb
    on_press:
      - script.execute:
          id: hood_send
          code_on: '101000010000100100011000100000111010'
          code_off: '101000010000100100011000100000110010'
          times: 6

  - platform: template
    name: "Fan +"
    icon: mdi:fan-plus
    on_press:
      - script.execute:
          id: hood_send
          code_on: '101000010000100100010001100010101010'
          code_off: '101000010000100100010001100010100010'
          times: 6

  - platform: template
    name: "Fan -"
    icon: mdi:fan-minus
    on_press:
      - script.execute:
          id: hood_send
          code_on: '101000010000100100001011100101001010'
          code_off: '101000010000100100001011100101000010'
          times: 6

  - platform: template
    name: "Left"
    icon: mdi:chevron-left
    on_press:
      - script.execute:
          id: hood_send
