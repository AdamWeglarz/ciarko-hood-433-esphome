          id: hood_send
          code_on: '101000010000100111111101111001101010'
          code_off: '101000010000100111111101111001100010'
          times: 6

  - platform: template
    name: "Timer"
    icon: mdi:timer-outline
    on_press:
      - script.execute:
          id: hood_send
          code_on: '101000010000100111111110100110011010'
          code_off: '101000010000100111111110100110010010'
          times: 6

  - platform: template
    name: "Timer (long press)"
    icon: mdi:timer-cog-outline
